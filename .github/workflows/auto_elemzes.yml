name: Automatikus Piacelemzo

on:
  schedule:
    # Magyar ido (CET) szerint 08:15, 12:15, 16:15 es 20:15 orakor fut
    - cron: '15 7,11,15,19 * * *'
  workflow_dispatch:

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Budapest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Csomagok telepitese
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Streamlit Secrets letrehozasa
        env:
          SECRETS_CONTENT: ${{ secrets.STREAMLIT_SECRETS }}
        run: |
          mkdir -p .streamlit
          printf "%s\n" "$SECRETS_CONTENT" > .streamlit/secrets.toml

      - name: Elemzes futtatasa
        run: python market_analyzer.py
