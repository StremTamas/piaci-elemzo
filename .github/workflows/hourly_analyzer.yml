name: AI Piaci Iranytu - 0-24 Orankenti Figyelo

on:
  schedule:
    # Minden óra 5. percében lefut 0-24 órában (kerülve a kerek órás szervercsúcsot)
    - cron: '5 * * * *'
  workflow_dispatch:
    # Manuális indítási lehetőség a GitHub Actions fülön teszteléshez

jobs:
  analyze-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Python 3.11 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Streamlit Secrets előkészítése
        env:
          STREAMLIT_SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          printf "%s" "$STREAMLIT_SECRETS_TOML" > .streamlit/secrets.toml

      - name: Piaci elemző és riasztó futtatása
        run: python background_runner.py

      - name: Ideiglenes secrets fájl törlése
        if: always()
        run: rm -f .streamlit/secrets.toml
